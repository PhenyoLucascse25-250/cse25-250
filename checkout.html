<section class="checkout-section">

    <div class="cart-box mb-4">
      <h3>Your Cart</h3>
      <ul id="cart-items"></ul>
      <h4>Total: P<span id="cart-total">0</span></h4>
      <button onclick="clearCart()" class="btn btn-danger mb-3">
        Clear Cart
    </button>
    
 </div>


 <form id="checkout-form">

      <div class="mb-3">
        <label>Username</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label>Bank Card Number</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label>Expiry Date</label>
        <input type="text" class="form-control" placeholder="MM/YY" required>
      </div>

      <button class="btn btn-dark">Place Order</button>

    </form>
    <p id="success-message" class="text-success text-center mt-3"></p>

  </div>
</section>
